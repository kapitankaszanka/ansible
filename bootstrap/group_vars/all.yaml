## A user who will be created for the needs of Ansible
automation_user: "ansible"
## Uncomment and add ssh key
automation_ssh_pub_key: ""

## A user who will be created for administration purpose.
admin_user: "admin"
## Uncomment and add ssh key
admin_ssh_pub_key: ""

dns_servers:
  - 8.8.8.8
  - 1.1.1.1
domains_name:
  - example.com
resolved_dnssec: no

ntp_servers:
  -  ntp1.example.com
ntp_fallback_servers:
  -  fallback-ntp1.example.com
  -  fallback-ntp2.example.com

