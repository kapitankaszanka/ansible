- block:
    - name: Fail if unsupported OS family
      when: ansible_os_family not in ['Debian', 'RedHat']
      ansible.builtin.fail:
        msg: "This role supports Debian and RedHat families, got {{ ansible_os_family }}"

    - name: Include DNS configuration (systemd-resolved)
      ansible.builtin.include_tasks: systemd_resolved.yaml
      when: ansible_os_family == "Debian"
      tags:
        - dns
        - resolved

    - name: Include NTP configuration (chrony)
      ansible.builtin.include_tasks: chrony.yaml
      tags:
        - ntp
        - chrony

  when: not_container | bool
